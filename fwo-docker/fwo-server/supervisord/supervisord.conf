; =============================================================================
; supervisord.conf - FWO Game Server Process Manager
; =============================================================================
; Game server binaries self-daemonize (ProcType daemon in their configs).
; We use wrapper scripts that launch the binary then tail its pidfile to keep
; supervisord happy while the actual daemon runs in the background.
; =============================================================================

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; =============================================================================
; Apache - GM admin web panel
; =============================================================================
[program:apache2]
command=/usr/sbin/apache2 -D FOREGROUND
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/apache2/supervisor-access.log
stderr_logfile=/var/log/apache2/supervisor-error.log

; =============================================================================
; authsys - Authentication server (port 7777 / WPort 8888)
; =============================================================================
[program:authsys]
command=/FWO13/scripts/run-daemon.sh authsys /FWO13/authsys/authsys /var/run/authsys.pid
directory=/FWO13/authsys
autostart=true
autorestart=true
startsecs=2
priority=20
stdout_logfile=/var/log/authsys.log
stderr_logfile=/var/log/authsys-error.log

; =============================================================================
; wctrlr - World Controller (port 8888)
; =============================================================================
[program:wctrlr]
command=/FWO13/scripts/run-daemon.sh wctrlr /FWO13/wctrlr/wctrlr /var/run/wctrlr.pid
directory=/FWO13/wctrlr
autostart=true
autorestart=true
startsecs=2
priority=30
stdout_logfile=/var/log/wctrlr.log
stderr_logfile=/var/log/wctrlr-error.log

; =============================================================================
; zoneserver - Zone/World server (ports 9999 / 9998)
; =============================================================================
[program:zoneserver]
command=/FWO13/scripts/run-daemon.sh zoneserver /FWO13/zoneserver/zoneserver /var/run/zoneserver.pid
directory=/FWO13/zoneserver
autostart=true
autorestart=true
startsecs=2
priority=40
stdout_logfile=/var/log/zoneserver.log
stderr_logfile=/var/log/zoneserver-error.log

; =============================================================================
; logserver - Logging daemon
; =============================================================================
[program:logserver]
command=/FWO13/scripts/run-daemon.sh logserver "/FWO13/logging/logserver fwo-db root ejair0xx" /var/run/logserver.pid
directory=/FWO13/logging
autostart=true
autorestart=true
startsecs=2
priority=25
stdout_logfile=/var/log/logserver.log
stderr_logfile=/var/log/logserver-error.log

[group:fwo-game]
programs=authsys,wctrlr,zoneserver,logserver
priority=999
