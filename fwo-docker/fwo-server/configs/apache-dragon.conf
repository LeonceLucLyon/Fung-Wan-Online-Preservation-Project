# =============================================================================
# Apache config for FWO GM Admin Panel (dragon)
# Accessible at http://localhost/dragon/ once containers are running
# =============================================================================

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html/dragon>
        Options Indexes FollowSymLinks
        AllowOverride All
        Order allow,deny
        Allow from all
    </Directory>

    # PHP settings for old PHP4 compatibility
    php_value magic_quotes_gpc 1
    php_value register_globals 1

    ErrorLog /var/log/apache2/dragon-error.log
    CustomLog /var/log/apache2/dragon-access.log combined
</VirtualHost>
